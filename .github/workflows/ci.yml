name: CI

on:
  push:
    branches:
      - main
      - training-eda
      - 'feat/**'
  pull_request:
    branches:
      - main
      - training-eda

jobs:
  ci:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          # Ignore cache warning if no requirements file exists yet
          cache-dependency-path: |
            **/requirements.txt
            **/pyproject.toml
            **/.pre-commit-config.yaml

      - name: Install Code Quality & Test Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure essential validation and testing tools are installed in the runner
          pip install pre-commit pytest mypy black isort ruff detect-secrets xenon

      - name: Cache Pre-commit Hook Environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run Pre-commit Hooks
        run: |
          pre-commit run --all-files --show-diff-on-failure

      - name: Run Unit Tests
        run: |
          python -c "import sys, pytest; code = pytest.main(); sys.exit(0 if code == 5 else code)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: backend:latest
